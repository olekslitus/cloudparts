name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validate content
        run: bun run validate
      - name: Type-check
        run: bunx astro sync && bunx tsc --noEmit
      - name: Build
        run: bun run build
