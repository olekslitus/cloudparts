    } else if (n.kind === 'queue'){
      n.w = n.cap*18 + 14; n.h = 34; n.buf = []; n.nextRel = 0;
    } else if (n.kind === 'log'){
      n.w = n.cells*22 + 12; n.h = 34; n.entries = []; n.len = 0;
      n.readers.forEach(r => { r.cursor = 0; r.next = undefined; });
    }
    if (n.emit) n.emit.next = undefined;
    return n;
  }

  /* ---------- geometry ---------- */
  anchor(n, tx, ty, side){
    if (n.kind === 'queue' || n.kind === 'log'){
      return side === 'out' ? {x:n.x + n.w/2, y:n.y} : {x:n.x - n.w/2, y:n.y};
    }
    const dx = tx - n.x, dy = ty - n.y;
    const hw = n.w/2 + 2, hh = n.h/2 + 2;
    const s = Math.min(dx ? hw/Math.abs(dx) : Infinity, dy ? hh/Math.abs(dy) : Infinity);
    return {x:n.x + dx*s, y:n.y + dy*s};
  }
  edgeGeom(aId, bId){
    const A = this.N[aId], B = this.N[bId];
    const pa0 = (A.kind==='queue'||A.kind==='log') ? this.anchor(A,0,0,'out') : null;
    const pb0 = (B.kind==='queue'||B.kind==='log') ? this.anchor(B,0,0,'in') : null;
    const pa = pa0 || this.anchor(A, (pb0||B).x, (pb0||B).y);
    const pb = pb0 || this.anchor(B, pa.x, pa.y);
    return {x1:pa.x, y1:pa.y, x2:pb.x, y2:pb.y, len:Math.hypot(pb.x-pa.x, pb.y-pa.y)};
  }
  geom(a, b){
    const g = this.E[a+'>'+b];
    if (g) return g;
    const r = this.E[b+'>'+a];
    if (r) return {x1:r.x2, y1:r.y2, x2:r.x1, y2:r.y1, len:r.len};
    return null;
  }

  /* ---------- build SVG ---------- */
  build(host){
    const id = 'ar' + (++uid);
    const svg = this.svg = sv('svg', {viewBox:`0 0 ${this.W} ${this.H}`, class:'dia' + (this.spec.wide ? ' wide' : ''), role:'img'});
    host.appendChild(svg);
    const defs = sv('defs', null, svg);
    const m = sv('marker', {id, viewBox:'0 0 8 8', refX:'7.5', refY:'4', markerWidth:'7', markerHeight:'7', orient:'auto'}, defs);
    sv('path', {d:'M0,0.6 L8,4 L0,7.4 z', class:'arrow'}, m);
    const gZ = sv('g', null, svg), gE = sv('g', null, svg), gN = sv('g', null, svg);
    this.gP = sv('g', null, svg); this.gF = sv('g', null, svg);

    (this.spec.zones || []).forEach(z => {
      sv('rect', {x:z.x, y:z.y, width:z.w, height:z.h, rx:6, class:'zone'}, gZ);
      sv('text', {x:z.x+10, y:z.y+16, class:'zlabel'}, gZ).textContent = z.label.toUpperCase();
    });

    // edges
    this.E = {};
    const pairs = [];
    const add = (a,b) => { if (!this.E[a+'>'+b] && !this.E[b+'>'+a] && this.N[a] && this.N[b]){ this.E[a+'>'+b] = this.edgeGeom(a,b); pairs.push([a,b]); } };
    Object.values(this.N).forEach(n => {
      n.out.forEach(t => add(n.id, t));
      if (n.rules) Object.values(n.rules).flat().forEach(t => add(n.id, t));
      if (n.deny) add(n.id, n.deny);
      if (n.emit && n.emit.to) n.emit.to.forEach(t => add(n.id, t));
      if (n.readers) n.readers.forEach(r => add(n.id, r.to));
    });
    pairs.forEach(([a,b]) => {
      const g = this.E[a+'>'+b];
      sv('line', {x1:g.x1, y1:g.y1, x2:g.x2, y2:g.y2, class:'edge', 'marker-end':`url(#${id})`}, gE);
    });

    // nodes
    Object.values(this.N).forEach(n => this.buildNode(n, gN));
  }

  buildNode(n, parent){
    const g = n.g = sv('g', {class:'node', transform:`translate(${n.x},${n.y})`}, parent);
    const box = n.box = sv('rect', {x:-n.w/2, y:-n.h/2, width:n.w, height:n.h, rx:(n.kind==='queue'||n.kind==='log') ? 3 : 6, class:'nbox'}, g);
    const above = (n.kind === 'queue' || n.kind === 'log');
    if (above){
      sv('text', {x:0, y:-n.h/2-21, 'text-anchor':'middle', class:'nlabel'}, g).textContent = n.label;
      if (n.sub) sv('text', {x:0, y:-n.h/2-8, 'text-anchor':'middle', class:'nsub'}, g).textContent = n.sub;
    } else if (n.kind === 'pool'){
      sv('text', {x:0, y:-n.h/2+18, 'text-anchor':'middle', class:'nlabel'}, g).textContent = n.label;
      if (n.sub) sv('text', {x:0, y:-n.h/2+31, 'text-anchor':'middle', class:'nsub'}, g).textContent = n.sub;
    } else {
      sv('text', {x:0, y:n.sub ? -3 : 4.5, 'text-anchor':'middle', class:'nlabel'}, g).textContent = n.label;
      if (n.sub) sv('text', {x:0, y:12.5, 'text-anchor':'middle', class:'nsub'}, g).textContent = n.sub;
    }
    if (n.emit && !n.emit.to) sv('circle', {cx:-n.w/2+8, cy:-n.h/2+8, r:2.6, class:'srcdot'}, g);

    if (n.kind === 'queue'){
      n.slotEls = [];
      for (let i=0;i<n.cap;i++) n.slotEls.push(sv('circle', {cx:n.w/2-16-i*18, cy:0, r:6.5, class:'slot-empty'}, g));
    }
    if (n.kind === 'log'){
      n.cellEls = []; n.cellTx = [];
      for (let i=0;i<n.cells;i++){
        const x = -n.w/2 + 6 + i*22;
        n.cellEls.push(sv('rect', {x, y:-11, width:19, height:22, rx:2, class:'cell empty'}, g));
        n.cellTx.push(sv('text', {x:x+9.5, y:3.2, 'text-anchor':'middle', class:'celltxt'}, g));
      }
      n.readers.forEach((r, ri) => {
        const y = n.h/2 + 13 + ri*15;
        r.tri = sv('path', {d:'M0,-5 L4.5,2.5 L-4.5,2.5 z', class:'cursor', transform:`translate(0,${y})`}, g);
        r.lab = sv('text', {x:-n.w/2 - 7, y:y+3, 'text-anchor':'end', class:'rlabel'}, g);
        r.y = y;
      });
    }
    if (n.kind === 'pool'){
      n.slotEls = [];
      const total = n.max*15 - 4;
      for (let i=0;i<n.max;i++) n.slotEls.push(sv('rect', {x:-total/2 + i*15, y:n.h/2-19, width:11, height:11, rx:2, class:'ps-none'}, g));
      n.blEl = sv('text', {x:0, y:n.h/2+13, 'text-anchor':'middle', class:'backlog'}, g);
    }
    const fy = above ? -n.h/2 - 36 : -n.h/2 - 8;
    n.flashEl = sv('text', {x:0, y:fy, 'text-anchor':'middle', class:'flash', opacity:0}, g);
    n.flashY = fy;

    if (n.concept && n.concept !== this.current){
      const c = CMAP[n.concept];
      g.classList.add('linkable');
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'link');
      g.setAttribute('aria-label', 'Open ' + c.name);
      sv('title', null, g).textContent = 'Open ' + c.name;
      const go = () => this.onNav(n.concept);
      g.addEventListener('click', go);
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } });
    }
  }

  /* ---------- behaviour ---------- */
  later(ms, fn){ this.timers.push({at:this.t + ms, fn}); }
  pulse(n){ n.pulseUntil = this.t + 260; }
  flash(n, text, cls){ n.flash = {text, cls, t:this.t}; }
  die(n, p){ const g = p.g; this.dies.push({x:g ? g.x2 : n.x, y:g ? g.y2 : n.y, color:p.color, t0:this.t}); }

  route(n, p, mode){
    const outs = n.out;
    switch (mode || n.route || 'rr'){
      case 'fanout': return outs.slice();
      case 'hash': return outs.length ? [outs[(p.key||0) % outs.length]] : [];
      case 'type': return (n.rules && n.rules[p.type]) || [];
      default: {
        const live = outs.filter(id => !this.N[id].disabled);
        if (!live.length) return [];
        return [live[(n.rr++) % live.length]];
      }
    }
  }

  send(from, to, pkt, reply){
    const g = this.geom(from, to);
    if (!g) return;
    const p = {color:pkt.color, req:pkt.req, type:pkt.type, key:pkt.key, reply:!!reply,
               from, to, t0:this.t, dur:Math.max(320, g.len / SPEED), g,
               path: reply ? pkt.path : [...(pkt.path||[]), from]};
    const T = this.N[to];
    if (T.kind === 'pool' && !reply) T.inflight++;
    this.packets.push(p);
  }

  reply(n, p){
    if (!p.path.length){ this.pulse(n); return; }
    const to = p.path[p.path.length-1];
    this.send(n.id, to, {...p, path:p.path.slice(0,-1)}, true);
  }

  emitFrom(n){
    const e = n.emit;
    const type = e.types ? e.types[rnd(e.types.length)] : e.type;
    let key, color;
    if (e.colorByKey){ key = rnd(e.colorByKey); color = COL[key % 4]; }
    else if (e.colorByType) color = COL[e.colorByType[type]];
    else if (e.cycle){ e.ci = ((e.ci || 0) + 1) % 4; color = COL[e.ci]; }
    else color = COL[e.color || 0];
    const pkt = {color, req:!!e.req, type, key, path:[]};
    const targets = e.to ? e.to : this.route(n, pkt, e.route);
    targets.forEach(t => this.send(n.id, t, pkt));
  }

  arrive(p){
    const n = this.N[p.to];
    if (n.kind === 'pool' && !p.reply) n.inflight = Math.max(0, n.inflight - 1);
    if (n.disabled){ this.flash(n, 'missed', 'bad'); this.die(n, p); return; }
    if (p.reply){ this.reply(n, p); return; }
    if (n.kind === 'queue'){
      if (n.buf.length >= n.cap){ this.flash(n, 'full: dropped', 'bad'); this.die(n, p); }
      else n.buf.push(p);
      return;
    }
    if (n.kind === 'log'){
      n.entries.push({off:n.len++, color:p.color});
      if (n.entries.length > 80) n.entries.splice(0, n.entries.length - 80);
      this.pulse(n);
      return;
    }
    if (n.kind === 'pool'){ this.poolAccept(n, p); return; }
    this.handle(n, p);
  }

  handle(n, p){
    const mode = n.mode || 'fwd';
    if (mode === 'sink'){ this.pulse(n); return; }
    if (mode === 'reply'){
      this.pulse(n);
      if (p.req) this.later(n.delay || 100, () => this.reply(n, p));
      return;
    }
    if (mode === 'cache' && p.req){
      if (Math.random() < n.p){ this.flash(n, 'HIT', 'ok'); this.pulse(n); this.later(40, () => this.reply(n, p)); }
      else { this.flash(n, 'MISS', 'warn'); this.forward(n, p); }
      return;
    }
    if (mode === 'gate'){
      const ok = n.allowTypes ? n.allowTypes.includes(p.type) : Math.random() < n.p;
      if (!ok){
        if (n.quiet){ this.pulse(n); return; }
        this.flash(n, n.denyText || 'denied', 'bad');
        if (n.deny) this.send(n.id, n.deny, p);
        else this.die(n, p);
        return;
      }
      if (n.allowText) this.flash(n, n.allowText, n.quiet ? 'bad' : 'ok');
    }
    this.forward(n, p);
  }

  forward(n, p){
    const targets = this.route(n, p);
    if (!targets.length){
      this.pulse(n);
      if (p.req) this.later(n.delay || 60, () => this.reply(n, p));
      return;
    }
    this.pulse(n);
    targets.forEach(t => this.send(n.id, t, p));
  }

  poolAccept(n, p){
    const free = n.slots.find(s => !s.busy);
    if (free) this.startJob(n, free, p, false);
    else if (n.slots.length < n.max){ const s = {busy:false, last:this.t}; n.slots.push(s); this.startJob(n, s, p, true); }
    else n.backlog.push(p);
  }
  startJob(n, s, p, cold){
    const coldMs = cold ? (n.cold || 0) : 0;
    s.busy = true; s.cold = cold && coldMs > 0; s.p = p;
    s.coldEnd = this.t + coldMs; s.end = this.t + (n.work || 500) + coldMs;
    if (s.cold) this.flash(n, n.coldText || 'cold start', 'warn');
  }

  step(dt){
    const t = this.t += dt;
    // timers
    if (this.timers.length){
      const due = this.timers.filter(x => x.at <= t);
      if (due.length){ this.timers = this.timers.filter(x => x.at > t); due.forEach(x => x.fn()); }
    }
    // scripted events
    this.events.forEach(ev => {
      if (t >= ev.next){
        const n = this.N[ev.node];
        n.disabled = true; this.flash(n, ev.text, 'bad');
        this.later(ev.dur, () => { n.disabled = false; this.flash(n, ev.back, 'ok'); });
        ev.next += ev.every;
      }
    });
    for (const n of Object.values(this.N)){
      // emitters
      const e = n.emit;
      if (e){
        let every = e.every;
        if (e.phases){
          const total = e.phases.reduce((a, ph) => a + ph[0], 0);
          let pos = t % total;
          for (const ph of e.phases){ if (pos < ph[0]){ every = ph[1]; break; } pos -= ph[0]; }
        }
        if (e.next === undefined) e.next = t + Math.random() * (every || 800);
        if (t >= e.next){
          if (every){ this.emitFrom(n); e.next = t + every * (1 + (Math.random()*2 - 1) * (e.jitter || 0)); }
          else e.next = t + 200;
        }
      }
      // queue release: only to a consumer with free capacity
      if (n.kind === 'queue' && n.buf.length && t >= n.nextRel){
        const ready = n.out.filter(id => {
          const c = this.N[id];
          if (c.disabled) return false;
          if (c.kind === 'pool') return c.slots.filter(s => s.busy).length + c.inflight + c.backlog.length < c.max;
          return true;
        });
        if (ready.length){
          const id = ready[(n.rr++) % ready.length];
          const p = n.buf.shift();
          this.send(n.id, id, p);
          n.nextRel = t + (n.gap || 150);
        }
      }
      // log readers
      if (n.kind === 'log'){
        n.readers.forEach(r => {
          if (r.next === undefined) r.next = t + Math.random() * r.every;
          if (t >= r.next){
            r.next = t + r.every;
            const oldest = n.len - (n.retain || 40);
            if (r.cursor < oldest){ r.cursor = oldest; this.flash(n, 'expired: past retention', 'warn'); }
            const k = Math.min(n.len - r.cursor, r.batch || 1);
            for (let i=0;i<k;i++){
              const ent = n.entries.find(x => x.off === r.cursor + i);
              const color = ent ? ent.color : COL[0];
              this.later(i*120, () => this.send(n.id, r.to, {color, req:false, path:[]}));
            }
            r.cursor += k;
          }
        });
      }
      // pools
      if (n.kind === 'pool'){
        n.slots.forEach(s => {
          if (s.busy && s.cold && t >= s.coldEnd) s.cold = false;
          if (s.busy && t >= s.end){
            s.busy = false; s.cold = false; s.last = t;
            const p = s.p; s.p = null;
            this.handle(n, p);
            if (n.backlog.length) this.startJob(n, s, n.backlog.shift(), false);
          }
        });
        if (n.slots.length > (n.min || 0)){
          const i = n.slots.findIndex(s => !s.busy && t - s.last > (n.idle || 3000));
          if (i >= 0){ n.slots.splice(i, 1); if (n.scaleText) this.flash(n, n.scaleText, 'info'); }
        }
      }
    }
    // packets
    const still = [];
    for (const p of this.packets){
      if (t - p.t0 >= p.dur){ if (p.el) p.el.remove(); this.arrive(p); }
      else still.push(p);
    }
    // arrive() may push new packets onto this.packets; keep those too
    const added = this.packets.filter(p => t - p.t0 < p.dur && !still.includes(p));
    this.packets = still.concat(added);
    this.dies = this.dies.filter(d => t - d.t0 < 500);
  }

  advance(ms){
    let left = ms;
    while (left > 0){ const d = Math.min(24, left); this.step(d); left -= d; }
  }

  render(){
    const t = this.t;
    for (const p of this.packets){
      if (!p.el){
        p.el = sv('circle', {r:5.5, class:'pk'}, this.gP);
        if (p.reply){ p.el.style.fill = 'var(--bench)'; p.el.style.stroke = p.color; p.el.setAttribute('r', 4.8); }
        else { p.el.style.fill = p.color; p.el.style.stroke = 'var(--bench)'; }
      }
      let k = (t - p.t0) / p.dur; k = k < 0 ? 0 : k > 1 ? 1 : k;
      k = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
      p.el.setAttribute('cx', (p.g.x1 + (p.g.x2 - p.g.x1)*k).toFixed(1));
      p.el.setAttribute('cy', (p.g.y1 + (p.g.y2 - p.g.y1)*k).toFixed(1));
    }
    // dying packets
    if (this.dieEls) this.dieEls.forEach(e => e.remove());
    this.dieEls = this.dies.map(d => {
      const a = (t - d.t0) / 500;
      const c = sv('circle', {cx:d.x, cy:d.y, r:(5.5 + a*9).toFixed(1), fill:'none', 'stroke-width':2, opacity:(1-a).toFixed(2)}, this.gF);
      c.style.stroke = 'var(--bad)';
      return c;
    });
    for (const n of Object.values(this.N)){
      n.g.classList.toggle('pulse', t < n.pulseUntil);
      n.g.classList.toggle('off', n.disabled);
      if (n.flash){
        const age = (t - n.flash.t) / 1300;
        if (age >= 1){ n.flash = null; n.flashEl.setAttribute('opacity', 0); }
        else {
          n.flashEl.textContent = n.flash.text;
          n.flashEl.setAttribute('class', 'flash ' + n.flash.cls);
          n.flashEl.setAttribute('opacity', (1 - Math.pow(age, 3)).toFixed(2));
          n.flashEl.setAttribute('y', (n.flashY - age*5).toFixed(1));
        }
      }
      if (n.kind === 'queue'){
        n.slotEls.forEach((c, i) => {
          const p = n.buf[i];
          if (p){ c.setAttribute('class', ''); c.style.fill = p.color; c.style.stroke = 'none'; }
          else { c.setAttribute('class', 'slot-empty'); c.style.fill = ''; c.style.stroke = ''; }
        });
      }
      if (n.kind === 'log'){
        const start = Math.max(0, n.len - (n.cells - 1));
        for (let i=0;i<n.cells;i++){
          const off = start + i;
          const ent = off < n.len ? n.entries.find(x => x.off === off) : null;
          const r = n.cellEls[i];
          if (ent){ r.setAttribute('class', 'cell'); r.style.fill = ent.color; n.cellTx[i].textContent = off; }
          else { r.setAttribute('class', 'cell empty'); r.style.fill = ''; n.cellTx[i].textContent = ''; }
        }
        n.readers.forEach(r => {
          let idx = r.cursor - start; if (idx < 0) idx = 0;
          const x = -n.w/2 + 6 + idx*22 + 9.5;
          r.tri.setAttribute('transform', `translate(${x},${r.y})`);
          const lag = n.len - r.cursor;
          r.lab.textContent = '';
          r.lab.appendChild(document.createTextNode(r.name));
          if (lag > 1){ const ts = sv('tspan', {class:'rlag'}, r.lab); ts.textContent = ` · ${lag} behind`; }
        });
      }
      if (n.kind === 'pool'){
        n.slotEls.forEach((el, i) => {
          const s = n.slots[i];
          el.setAttribute('class', !s ? 'ps-none' : s.cold ? 'ps-cold' : s.busy ? 'ps-busy' : 'ps-idle');
        });
        n.blEl.textContent = n.backlog.length ? `+${n.backlog.length} waiting` : '';
      }
    }
  }

  destroy(){
    this.dead = true;
    this.io.disconnect();
  }
}

let SIMS = [];
let lastFrame = performance.now();
function frame(now){
  const dt = Math.min(60, now - lastFrame); lastFrame = now;
  if (!document.hidden){
    for (const s of SIMS){
      if (!s.dead && s.running && s.visible){ s.advance(dt * s.speed); s.render(); }
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function mountBenches(root, current){
  root.querySelectorAll('[data-bench]').forEach(b => {
    const key = b.dataset.bench;
    const sim = new Sim(b.querySelector('.svgwrap'), DIAG[key], {onNav:id => go(id), current});
    sim.svg.setAttribute('aria-label', b.querySelector('.caption').textContent);
    sim.advance(key === 'map' ? 7000 : 5200);
    sim.render();
    SIMS.push(sim);
    const play = b.querySelector('.play');
    const sync = () => {
      play.textContent = sim.running ? 'Pause' : 'Play';
      play.setAttribute('aria-pressed', String(!sim.running));
      b.classList.toggle('paused', !sim.running);
    };
    play.addEventListener('click', () => { sim.running = !sim.running; sync(); });
    b.querySelectorAll('[data-s]').forEach(btn => btn.addEventListener('click', () => {
      sim.speed = parseFloat(btn.dataset.s);
      b.querySelectorAll('[data-s]').forEach(x => x.setAttribute('aria-pressed', String(x === btn)));
      if (!sim.running){ sim.running = true; sync(); }
    }));
    sync();
  });
}

/* =====================================================================
   RENDERING
   ===================================================================== */
const CMAP = {}; CONCEPTS.forEach(c => CMAP[c.id] = c);
const CATMAP = {}; CATS.forEach(c => CATMAP[c.id] = c);
CATS.forEach(cat => {
  CONCEPTS.filter(c => c.cat === cat.id).forEach((c, i) => { c.code = `${cat.code}-${String(i+1).padStart(2,'0')}`; });
});

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

function hl(src, lang){
  const hash = ['python','bash','yaml','hcl','nginx','http','dockerfile'].includes(lang);
  const slash = ['json','ts','hcl'].includes(lang);
  const dash = lang === 'sql';
  return src.split('\n').map(line => {
    let out = '', buf = '', q = null;
    const flush = cls => { if (buf){ out += cls ? `<span class="${cls}">${esc(buf)}</span>` : esc(buf); buf = ''; } };
    for (let i=0;i<line.length;i++){
      const c = line[i];
      if (q){ buf += c; if (c === q && line[i-1] !== '\\'){ flush('s'); q = null; } continue; }
      const isComment = (hash && c === '#' && (i === 0 || /\s/.test(line[i-1]))) ||
                        (slash && c === '/' && line[i+1] === '/') ||
                        (dash && c === '-' && line[i+1] === '-');
      if (isComment){ flush(); buf = line.slice(i); flush('c'); break; }
      if (c === '"' || (c === "'" && lang !== 'dockerfile')){ flush(); q = c; buf = c; continue; }
      buf += c;
    }
    q ? flush('s') : flush();
    return out;
  }).join('\n');
}

const LEGEND = `<span class="legend">
  <span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" style="fill:var(--p1)"/></svg>data or request</span>
  <span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4" style="fill:none;stroke:var(--p1);stroke-width:2"/></svg>response</span>
  <span><svg width="22" height="12" aria-hidden="true"><rect x="1" y="1" width="9" height="9" rx="2" style="fill:var(--accent)"/><rect x="12" y="1" width="9" height="9" rx="2" style="fill:none;stroke:var(--accent)"/></svg>busy / idle instance</span>
</span>`;

function bench(key, caption){
  return `<section class="bench" data-bench="${key}">
    <div class="bench-bar">
      <span class="bench-title"><i></i>Live model</span>
      ${LEGEND}
      <span class="ctl">
        <button class="play" type="button">Pause</button>
        <button type="button" data-s="0.5" aria-pressed="false" aria-label="Half speed">½×</button>
        <button type="button" data-s="1" aria-pressed="true" aria-label="Normal speed">1×</button>
        <button type="button" data-s="2" aria-pressed="false" aria-label="Double speed">2×</button>
      </span>
    </div>
    <div class="bench-scroll"><div class="svgwrap"></div></div>
    <p class="caption"><b>What you’re watching</b>${esc(caption)}</p>
  </section>`;
}

function viewMap(){
  const cats = CATS.map(cat => `
    <section class="cat">
      <header><span>${cat.code}</span><h3>${cat.name}</h3></header>
      <p>${cat.blurb}</p>
      <ul>${CONCEPTS.filter(c => c.cat === cat.id).map(c => `
        <li><a href="#${c.id}"><span class="row1"><span class="cd">${c.code}</span><span class="nm">${esc(c.name)}</span></span><span class="sh">${esc(c.short)}</span></a></li>`).join('')}
      </ul>
    </section>`).join('');
  const mix = MIXUPS.map(m => `<li><a href="#${m.id}">${esc(m.title)}<span>${m.parts.length} parts</span></a></li>`).join('');
  return `<div class="wrap">
    <section class="hero">
      <p class="eyebrow"><span class="code">${CONCEPTS.length} parts</span><span>6 families</span><span>AWS · Google Cloud · Azure · open source</span></p>
      <h1>What the boxes on a cloud diagram actually do</h1>
      <p class="lede">Each part of a modern cloud system, explained in plain language, with a working model you can watch, the situations it’s built for, and what every provider calls it.</p>
    </section>
    ${bench('map', 'Two journeys through one system. On top, sensor readings flow through a broker into a stream, where functions write them to a time-series database while an archiver batches them into object storage. Below, an operator’s dashboard request passes a CDN, a gateway and API pods, and is answered from cache when it can. Click any underlined part to open it.')}
    <section class="index">
      <div class="index-head"><h2>All parts</h2><p>Press <code>/</code> to search by name or product, such as Kafka or S3.</p></div>
      <div class="cats">${cats}</div>
    </section>
    <section class="teaser">
      <div class="index-head"><h2>Commonly confused</h2><p>Side-by-side comparisons of parts that sound alike.</p></div>
      <ul>${mix}</ul>
    </section>
  </div>`;
}

function viewConcept(c){
  const cat = CATMAP[c.cat];
  const i = CONCEPTS.indexOf(c);
  const prev = CONCEPTS[(i - 1 + CONCEPTS.length) % CONCEPTS.length];
  const next = CONCEPTS[(i + 1) % CONCEPTS.length];
  const mixes = MIXUPS.filter(m => m.parts.includes(c.id));
  const P = c.providers;
  return `<article class="wrap">
    <header class="concept-head">
      <p class="eyebrow"><span class="code">${c.code}</span><span>${cat.name}</span></p>
      <h1>${esc(c.name)}</h1>
      <p class="lede">${md(c.short)}</p>
    </header>
    ${bench(c.id, c.caption)}
    <div class="cols">
      <section>
        <h3 class="sec">How it works</h3>
        <p class="prose">${md(c.what)}</p>
        <div class="analogy"><h3 class="sec">Think of it as</h3><p>${md(c.analogy)}</p></div>
      </section>
      <section class="lists">
        <div class="yes"><h3 class="sec">Reach for it when</h3><ul>${c.use.map(u => `<li>${md(u)}</li>`).join('')}</ul></div>
        <div class="no"><h3 class="sec">Think twice when</h3><ul>${c.avoid.map(u => `<li>${md(u)}</li>`).join('')}</ul></div>
      </section>
    </div>
    <section class="example"><h3 class="sec">A real example</h3><p>${md(c.example)}</p></section>
    <section class="providers">
      <h3 class="sec">What each provider calls it</h3>
      <dl class="pgrid">
        <div><dt>AWS</dt><dd>${esc(P.aws)}</dd></div>
        <div><dt>Google Cloud</dt><dd>${esc(P.gcp)}</dd></div>
        <div><dt>Azure</dt><dd>${esc(P.azure)}</dd></div>
        <div><dt>Open source &amp; others</dt><dd>${esc(P.oss)}</dd></div>
      </dl>
    </section>
    <section class="codebox">
      <div class="codehead"><h3 class="sec">In code · ${esc(c.lang)}</h3><button class="copy" type="button">Copy</button></div>
      <pre class="code"><code>${hl(c.code, c.lang)}</code></pre>
    </section>
    <section class="related">
      <h3 class="sec">Often confused with</h3>
      <div class="chips">
        ${c.related.map(r => `<a class="chip" href="#${r}"><span>${CMAP[r].code}</span>${esc(CMAP[r].name)}</a>`).join('')}
        ${mixes.map(m => `<a class="chip vs" href="#${m.id}"><span>COMPARE</span>${esc(m.title)}</a>`).join('')}
      </div>
    </section>
    <nav class="pager" aria-label="Previous and next part">
      <a href="#${prev.id}"><small>← ${prev.code}</small><b>${esc(prev.name)}</b></a>
      <a class="next" href="#${next.id}"><small>${next.code} →</small><b>${esc(next.name)}</b></a>
    </nav>
  </article>`;
}

function viewMix(m){
  const tabs = MIXUPS.map(x => `<a href="#${x.id}"${x === m ? ' aria-current="page"' : ''}>${esc(x.title)}</a>`).join('');
  const head = m.parts.map(id => `<th scope="col"><a href="#${id}"><small>${CMAP[id].code}</small>${esc(CMAP[id].name)}</a></th>`).join('');
  const rows = m.rows.map(r => `<tr><th scope="row">${esc(r[0])}</th>${r.slice(1).map(v => `<td>${md(v)}</td>`).join('')}</tr>`).join('');
  return `<div class="wrap mix">
    <p class="eyebrow"><span class="code">Mix-ups</span><span>${MIXUPS.length} comparisons</span></p>
    <h1>Parts that sound alike</h1>
    <p class="lede">Each of these pairs or trios gets mixed up in design reviews. Here’s how they actually differ.</p>
    <nav class="tabs" aria-label="Comparisons">${tabs}</nav>
    <h2>${esc(m.title)}</h2>
    <div class="tablewrap"><table class="cmp"><thead><tr><th scope="col"><span class="sr" hidden>Dimension</span></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <section class="tip"><h3 class="sec">Rule of thumb</h3><p>${md(m.tip)}</p></section>
  </div>`;
}

/* ---------- rail ---------- */
const railList = document.getElementById('railList');
const q = document.getElementById('q');
function hit(c, term){
  if (!term) return true;
  const hay = [c.name, c.short, c.id, c.code, ...Object.values(c.providers)].join(' ').toLowerCase();
  return term.split(/\s+/).every(w => hay.includes(w));
}
function renderRail(active){
  const term = q.value.trim().toLowerCase();
  let html = '', count = 0;
  CATS.forEach(cat => {
    const items = CONCEPTS.filter(c => c.cat === cat.id && hit(c, term));
    if (!items.length) return;
    count += items.length;
    html += `<h3><span>${cat.name}</span><span>${cat.code}</span></h3><ul>${items.map(c => {
      const prov = term && !c.name.toLowerCase().includes(term) ? matchedProduct(c, term) : '';
      return `<li><a href="#${c.id}"${c.id === active ? ' aria-current="page"' : ''}><span>${c.code}</span>${esc(c.name)}${prov}</a></li>`;
    }).join('')}</ul>`;
  });
  railList.innerHTML = count ? html : `<p class="empty">No parts match “${esc(q.value)}”. Try a product name like SQS, Kafka or Redis.</p>`;
}
function matchedProduct(c, term){
  const all = Object.values(c.providers).join(', ').split(/,\s*|;\s*/);
  const m = all.find(p => p.toLowerCase().includes(term.split(/\s+/)[0]));
  return m ? `<br><mark>${esc(m.trim())}</mark>` : '';
}
q.addEventListener('input', () => renderRail(currentId));
q.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ const a = railList.querySelector('a'); if (a){ go(a.getAttribute('href').slice(1)); } }
  if (e.key === 'Escape'){ q.value = ''; renderRail(currentId); q.blur(); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)){
    e.preventDefault(); openRail(true); q.focus();
  }
});

const rail = document.getElementById('rail');
const railToggle = document.getElementById('railToggle');
function openRail(open){
  rail.classList.toggle('open', open);
  railToggle.setAttribute('aria-expanded', String(open));
  railToggle.textContent = open ? 'Close' : 'All parts';
}
railToggle.addEventListener('click', () => openRail(!rail.classList.contains('open')));

/* ---------- routing ---------- */
const main = document.getElementById('main');
let currentId = null;
function go(id){
  if (location.hash.slice(1) === id) route();
  else location.hash = id;
}
function route(){
  let id = '';
  try { id = decodeURIComponent(location.hash.slice(1)); } catch (_) {}
  SIMS.forEach(s => s.destroy()); SIMS = [];
  let html, active = null, section = 'map';
  if (CMAP[id]){ html = viewConcept(CMAP[id]); active = id; section = 'part'; }
  else if (id === 'mixups' || MIXUPS.some(m => m.id === id)){
    html = viewMix(MIXUPS.find(m => m.id === id) || MIXUPS[0]); section = 'mix';
  }
  else html = viewMap();
  currentId = active;
  main.innerHTML = html;
  mountBenches(main, active);
  main.querySelectorAll('.copy').forEach(btn => btn.addEventListener('click', () => {
    const pre = btn.closest('.codebox').querySelector('pre');
    const done = () => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1400); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(pre);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      btn.textContent = 'Selected: press ⌘C';
      setTimeout(() => btn.textContent = 'Copy', 2200);
    };
    try { navigator.clipboard.writeText(pre.innerText).then(done, fallback); } catch (_) { fallback(); }
  }));
  document.getElementById('nav-map').toggleAttribute('aria-current', section === 'map');
  document.getElementById('nav-mix').toggleAttribute('aria-current', section === 'mix');
  if (section === 'map') document.getElementById('nav-map').setAttribute('aria-current','page');
  if (section === 'mix') document.getElementById('nav-mix').setAttribute('aria-current','page');
  document.title = active ? `${CMAP[active].name} · Cloud Parts Catalog` : 'Cloud Parts Catalog';
  renderRail(active);
  openRail(false);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
