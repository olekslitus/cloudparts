<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cloud Parts Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --ground:#ECEEE8; --surface:#F8F9F5; --bench:#F3F5EF; --grid:#D3D9CF;
  --ink:#16201B; --ink-2:#38443E; --muted:#5F6B64; --line:#CDD3C9; --line-strong:#99A49C;
  --accent:#2944C9; --accent-soft:#DFE4F8; --on-accent:#FFFFFF;
  --p1:#2944C9; --p2:#C8701C; --p3:#138C77; --p4:#B6356C; --on-p:#FFFFFF;
  --ok:#17875A; --warn:#B26E12; --bad:#C0352B;
  --zone:rgba(41,68,201,.035);
  --code-bg:#E4E8E0; --code-ink:#1E2923; --code-c:#6E7A72; --code-s:#1C7A55;
  --f-ui:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --f-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --hh:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1411; --surface:#161D19; --bench:#121814; --grid:#243029;
    --ink:#E3E8E2; --ink-2:#BAC4BD; --muted:#8E9B93; --line:#29352E; --line-strong:#4A584F;
    --accent:#8599FF; --accent-soft:#1D2548; --on-accent:#0F1411;
    --p1:#8599FF; --p2:#E89B4D; --p3:#44C4AA; --p4:#E86E9F; --on-p:#0F1411;
    --ok:#4CC38A; --warn:#E3A344; --bad:#F0736A;
    --zone:rgba(133,153,255,.05);
    --code-bg:#0B0F0D; --code-ink:#D5DDD6; --code-c:#6F7D74; --code-s:#7FD3A6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1411; --surface:#161D19; --bench:#121814; --grid:#243029;
  --ink:#E3E8E2; --ink-2:#BAC4BD; --muted:#8E9B93; --line:#29352E; --line-strong:#4A584F;
  --accent:#8599FF; --accent-soft:#1D2548; --on-accent:#0F1411;
  --p1:#8599FF; --p2:#E89B4D; --p3:#44C4AA; --p4:#E86E9F; --on-p:#0F1411;
  --ok:#4CC38A; --warn:#E3A344; --bad:#F0736A;
  --zone:rgba(133,153,255,.05);
  --code-bg:#0B0F0D; --code-ink:#D5DDD6; --code-c:#6F7D74; --code-s:#7FD3A6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
code{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);color:var(--code-ink);padding:.08em .35em;border-radius:3px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--hh);display:flex;align-items:center;gap:20px;padding-inline:20px;background:var(--ground);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand svg{flex:none}
.brand b{font-weight:760;font-stretch:118%;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a,.rail-toggle{font-size:13.5px;font-weight:560;text-decoration:none;padding:7px 12px;border-radius:5px;border:1px solid transparent;background:none;cursor:pointer;white-space:nowrap}
.nav a:hover,.rail-toggle:hover{background:var(--surface);border-color:var(--line)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--ground)}
.rail-toggle{display:none;border-color:var(--line)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);max-width:1400px;margin-inline:auto}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));height:calc(100vh - var(--hh) - env(safe-area-inset-top,0px));overflow-y:auto;padding:18px 16px 40px 20px;border-right:1px solid var(--line)}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;font:inherit;font-size:14px;padding:9px 34px 9px 11px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line-strong);border-radius:3px;padding:0 5px}
.rail h3{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;display:flex;justify-content:space-between}
.rail ul{list-style:none;margin:0;padding:0}
.rail li a{display:grid;grid-template-columns:58px 1fr;align-items:baseline;gap:6px;padding:5px 8px;margin-inline:-8px;border-radius:4px;text-decoration:none;font-size:14px}
.rail li a span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.rail li a:hover{background:var(--surface)}
.rail li a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.rail li a[aria-current="page"] span{color:var(--accent)}
.rail .empty{font-size:13.5px;color:var(--muted);padding:6px 0}
.rail mark{background:none;color:var(--accent);font-weight:650}

main{min-width:0;padding:34px 40px 80px}
.wrap{max-width:1000px}

/* ---------- type ---------- */
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;gap:10px;flex-wrap:wrap}
.eyebrow .code{color:var(--accent);font-weight:700}
h1{font-weight:760;font-stretch:115%;font-size:clamp(30px,4.3vw,50px);line-height:1.04;letter-spacing:-.022em;margin:0 0 14px;text-wrap:balance}
h2{font-weight:720;font-stretch:112%;font-size:22px;letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
h3.sec{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.lede{font-family:var(--f-body);font-size:clamp(18px,1.8vw,21px);line-height:1.45;color:var(--ink-2);max-width:40em;margin:0}
.prose{font-family:var(--f-body);font-size:17px;line-height:1.6;max-width:36em;margin:0}

/* ---------- bench (diagram frame) ---------- */
.bench{margin-top:26px;border:1px solid var(--line-strong);border-radius:6px;background-color:var(--bench);background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:18px 18px;overflow:hidden}
.bench-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.bench-title{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.bench-title i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.bench.paused .bench-title i{background:var(--line-strong)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ctl{margin-left:auto;display:flex;gap:6px;align-items:center}
.ctl button{font-family:var(--f-mono);font-size:11.5px;padding:4px 9px;border:1px solid var(--line-strong);background:var(--bench);border-radius:4px;cursor:pointer;min-width:34px}
.ctl button:hover{border-color:var(--ink-2)}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.ctl .play{min-width:68px}
.bench-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.svgwrap{padding:6px 8px}
.caption{margin:0;padding:11px 14px 13px;border-top:1px solid var(--line);background:var(--surface);font-family:var(--f-body);font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.caption b{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-right:6px}

/* ---------- SVG diagram ---------- */
.dia{display:block;width:100%;height:auto}
.dia .edge{stroke:var(--line-strong);stroke-width:1.4;fill:none}
.dia .edge.dash{stroke-dasharray:4 4}
.dia .arrow{fill:var(--line-strong)}
.dia .zone{fill:var(--zone);stroke:var(--line-strong);stroke-dasharray:5 4;stroke-width:1}
.dia .zlabel{font:500 9.5px var(--f-mono);letter-spacing:.08em;fill:var(--muted)}
.dia .nbox{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.2;transition:stroke .15s}
.dia .node.pulse .nbox{stroke:var(--accent);stroke-width:2.2}
.dia .node.off{opacity:.38}
.dia .node.off .nbox{stroke-dasharray:4 3}
.dia .node.linkable{cursor:pointer}
.dia .node.linkable .nlabel{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.dia .node.linkable:hover .nbox,.dia .node.linkable:focus-visible .nbox{fill:var(--accent-soft);stroke:var(--accent)}
.dia .node:focus{outline:none}
.dia .srcdot{fill:var(--ink-2)}
.dia .nlabel{font:600 13px var(--f-ui);fill:var(--ink)}
.dia .nsub{font:400 9.5px var(--f-mono);fill:var(--muted)}
.dia .flash{font:700 10.5px var(--f-mono);letter-spacing:.05em}
.dia .flash.ok{fill:var(--ok)} .dia .flash.bad{fill:var(--bad)} .dia .flash.warn{fill:var(--warn)} .dia .flash.info{fill:var(--muted)}
.dia .slot-empty{fill:none;stroke:var(--line-strong);stroke-dasharray:2 2}
.dia .cell{stroke:none}
.dia .cell.empty{fill:none;stroke:var(--line-strong);stroke-dasharray:3 3}
.dia .celltxt{font:600 9px var(--f-mono);fill:var(--on-p)}
.dia .cursor{fill:var(--ink)}
.dia .rlabel{font:500 9.5px var(--f-mono);fill:var(--ink-2)}
.dia .rlag{fill:var(--warn)}
.dia .ps-none{fill:none;stroke:var(--line);stroke-dasharray:2 2}
.dia .ps-idle{fill:none;stroke:var(--accent);stroke-width:1.3}
.dia .ps-busy{fill:var(--accent);stroke:var(--accent)}
.dia .ps-cold{fill:var(--p2);stroke:var(--p2)}
.dia .backlog{font:500 9.5px var(--f-mono);fill:var(--warn)}
.dia .pk{stroke-width:2}

/* ---------- map page ---------- */
.hero{max-width:900px}
.index{margin-top:56px}
.index-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:10px;margin-bottom:4px}
.index-head h2{margin:0}
.index-head p{margin:0;color:var(--muted);font-size:13.5px}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:36px}
.cat{padding-top:22px}
.cat header{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.cat header span{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.cat header h3{margin:0;font-size:17px;font-weight:720;font-stretch:110%}
.cat > p{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.cat ul{list-style:none;margin:0;padding:0}
.cat li a{display:block;text-decoration:none;padding:9px 0;border-top:1px solid var(--line)}
.cat li a:hover .nm{color:var(--accent)}
.cat .row1{display:flex;gap:10px;align-items:baseline}
.cat .cd{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);flex:none;width:48px}
.cat .nm{font-weight:620;font-size:15px}
.cat .sh{display:block;margin-left:58px;font-family:var(--f-body);font-size:14.5px;color:var(--ink-2);line-height:1.4}
.teaser{margin-top:56px}
.teaser ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 36px}
.teaser li a{display:flex;justify-content:space-between;gap:12px;text-decoration:none;padding:12px 0;border-top:1px solid var(--line);font-weight:600}
.teaser li a:hover{color:var(--accent)}
.teaser li a span{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}

/* ---------- concept page ---------- */
.concept-head{max-width:860px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;margin-top:40px}
.analogy{margin-top:22px;padding:14px 16px;border-left:3px solid var(--p2);background:var(--surface);border-radius:0 5px 5px 0}
.analogy h3.sec{color:var(--p2)}
.analogy p{margin:0;font-family:var(--f-body);font-style:italic;font-size:17px;line-height:1.5}
.lists{display:grid;gap:26px;align-content:start}
.lists ul{list-style:none;margin:0;padding:0}
.lists li{position:relative;padding:7px 0 7px 22px;border-top:1px solid var(--line);font-family:var(--f-body);font-size:16px;line-height:1.45}
.lists li::before{content:"";position:absolute;left:2px;top:14px;width:9px;height:9px;border-radius:50%}
.lists .yes li::before{background:var(--ok)}
.lists .no li::before{border:2px solid var(--bad);width:9px;height:9px;box-sizing:border-box}
.example{margin-top:44px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding-top:18px;border-top:1.5px solid var(--ink)}
.example p{margin:0;font-family:var(--f-body);font-size:17.5px;line-height:1.55;max-width:38em}
.providers{margin-top:44px}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.pgrid div{padding:12px 14px;border-left:1px solid var(--line)}
.pgrid div:first-child{border-left:0}
.pgrid dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.pgrid dd{margin:0;font-weight:600;font-size:14.5px;line-height:1.4}
.codebox{margin-top:44px}
.codehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.codehead h3.sec{margin:0}
.copy{font-family:var(--f-mono);font-size:11.5px;padding:4px 10px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);cursor:pointer}
.copy:hover{border-color:var(--ink-2)}
pre.code{margin:0;padding:16px 18px;background:var(--code-bg);color:var(--code-ink);border-radius:6px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.6;tab-size:2}
pre.code .c{color:var(--code-c);font-style:italic}
pre.code .s{color:var(--code-s)}
.related{margin-top:44px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:baseline;padding-top:18px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:8px;align-items:baseline;text-decoration:none;padding:6px 11px;border:1px solid var(--line-strong);border-radius:4px;font-size:14px;font-weight:560;background:var(--surface)}
.chip span{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.vs{border-style:dashed}
.pager{margin-top:48px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pager a{display:block;text-decoration:none;padding:14px 16px;border:1px solid var(--line);border-radius:6px}
.pager a:hover{border-color:var(--ink-2)}
.pager a small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.pager a b{font-weight:680;font-size:16px}
.pager .next{text-align:right}

/* ---------- mix-ups ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:24px 0 0}
.tabs a{text-decoration:none;font-size:13.5px;font-weight:580;padding:7px 12px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface)}
.tabs a:hover{border-color:var(--ink-2)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.mix h2{margin-top:32px;font-size:28px}
.tablewrap{overflow-x:auto;margin-top:18px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
table.cmp{border-collapse:collapse;width:100%;min-width:620px}
table.cmp th,table.cmp td{text-align:left;vertical-align:top;padding:11px 14px;border-top:1px solid var(--line)}
table.cmp thead th{border-top:0;background:var(--bench);font-size:15px}
table.cmp thead th a{text-decoration:none;font-weight:700}
table.cmp thead th a:hover{color:var(--accent)}
table.cmp thead th small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:400}
table.cmp tbody th{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);width:170px}
table.cmp td{font-family:var(--f-body);font-size:15.5px;line-height:1.45}
.tip{margin-top:20px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding-top:16px;border-top:1.5px solid var(--ink)}
.tip p{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.55;max-width:38em}

/* ---------- responsive ---------- */
@media (max-width: 1100px){
  .cats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .teaser ul{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 880px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail-toggle{display:inline-block}
  .rail{position:fixed;z-index:25;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + var(--hh));height:auto;background:var(--ground);border-right:0;transform:translateX(-100%);visibility:hidden;transition:transform .2s ease,visibility .2s;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  .rail.open{transform:none;visibility:visible}
  main{padding:26px 16px 64px}
  .cols{grid-template-columns:minmax(0,1fr);gap:30px}
  .example,.tip{grid-template-columns:minmax(0,1fr);gap:8px}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgrid div:nth-child(3){border-left:0}
  .pgrid div:nth-child(n+3){border-top:1px solid var(--line)}
  .dia{min-width:640px}
  .dia.wide{min-width:780px}
}
@media (max-width: 620px){
  .top{gap:10px;padding-inline:16px}
  .brand b{font-size:15px}
  .nav a{padding:7px 8px}
  .cats,.teaser ul{grid-template-columns:minmax(0,1fr)}
  .legend{display:none}
  .pager{grid-template-columns:minmax(0,1fr)}
  .pager .next{text-align:left}
}
@media (max-width: 420px){
  .brand .long{display:none}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important}
}
</style>
</head>
<body>


<header class="top">
  <a class="brand" href="#map" aria-label="Cloud Parts Catalog, home">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 17 L13 9 L20 17" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="17" r="2.4" fill="var(--p2)"/><circle cx="13" cy="9" r="2.4" fill="var(--p1)"/><circle cx="20" cy="17" r="2.4" fill="var(--p3)"/></svg>
    <b>Cloud Parts <span class="long">Catalog</span></b>
  </a>
  <nav class="nav" aria-label="Sections">
    <a href="#map" id="nav-map">Map</a>
    <a href="#mixups" id="nav-mix">Mix-ups</a>
  </nav>
  <button class="rail-toggle" id="railToggle" aria-expanded="false" aria-controls="rail">All parts</button>
</header>

<div class="shell">
  <aside class="rail" id="rail" aria-label="All parts">
    <div class="search">
      <label for="q" class="sr" hidden>Search parts</label>
      <input id="q" type="search" placeholder="Search: Kafka, S3, cache…" autocomplete="off" aria-label="Search parts">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <div id="railList"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<script>
/* =====================================================================
   CONTENT
   ===================================================================== */
const CATS = [
  {id:'compute',   code:'CMP', name:'Compute',    blurb:'Where your code actually runs.'},

/* ---------------- COMPUTE ---------------- */
{ id:'vm', cat:'compute', name:'Virtual machines',
  short:'A whole computer, carved out of a bigger physical one.',
  what:'A hypervisor splits one physical server into several isolated machines. Each VM gets its own virtual CPUs, memory and disk, plus a full operating system that you install, patch and secure. To your software it looks exactly like a real server.',
  analogy:'Renting a furnished apartment in a big building. The walls are yours to paint, the plumbing is shared, and everything inside your door is your responsibility.',
  use:['Lifting an existing app off an office server without rewriting it','Software that needs a specific OS, kernel module or licensed agent','Long-running workloads where you want full control over tuning'],
  avoid:['Spiky traffic: you pay for the machine while it sits idle','Small teams that don’t want to own OS patching and hardening'],
  example:'A company moves its ten-year-old Windows ERP system to the cloud by copying it onto an 8-vCPU VM. Nothing in the app changes; the server just lives in a cloud data center now.',
  providers:{aws:'EC2', gcp:'Compute Engine', azure:'Virtual Machines', oss:'KVM, Proxmox, OpenStack'},
  lang:'bash', code:String.raw`# Launch one Ubuntu VM with 2 vCPU / 4 GB
aws ec2 run-instances \
  --image-id ami-0abcdef1234567890 \
  --instance-type t3.medium \
  --key-name my-key \
  --subnet-id subnet-0a1b2c3d`,
  related:['containers','autoscaling','block'],
  caption:'Traffic for three different tenants lands on three VMs that share one physical server. Each VM runs its own operating system and can’t see the others.' },

{ id:'containers', cat:'compute', name:'Containers',
  short:'Your app and everything it needs, packed into one portable image.',
  what:'A container image bundles your code with its runtime, libraries and config. When it runs, the host’s kernel isolates it into its own processes, filesystem and network. Containers share the host OS instead of booting their own, so they start in about a second and one machine can run dozens of them.',
  analogy:'A shipping container. The crane, the ship and the truck don’t care what’s inside, because the box is always the same shape.',
  use:['Ending “works on my machine”: dev, CI and production run the same image','Packaging services that need specific library versions','Running many small services densely on shared machines'],
  avoid:['Apps that need a different kernel or a desktop GUI','A tiny task triggered a few times a day, where a serverless function is simpler'],
  example:'A data team ships a Python API as `api:1.4.2`. The same image runs on a developer’s laptop, in the CI test job and in production. Upgrading means publishing a new tag.',
  providers:{aws:'ECS, Fargate, ECR (registry)', gcp:'Cloud Run, Artifact Registry', azure:'Container Apps, Container Registry', oss:'Docker, Podman, containerd'},
  lang:'dockerfile', code:String.raw`FROM python:3.12-slim
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY . .
CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]`,
  related:['vm','orchestration','serverless'],
  caption:'A Dockerfile becomes one tagged image in a registry. Every environment pulls that exact image, so they all run the same bits.' },

{ id:'orchestration', cat:'compute', name:'Container orchestration',
  short:'Software that keeps your containers running, wherever there’s room.',
  what:'An orchestrator runs containers across a fleet of machines. You declare the desired state (three copies of `api:1.4.2`, 512 MB each) and a control loop keeps making reality match it. It places containers on machines with free capacity, restarts crashed ones, replaces them when a machine dies, rolls out new versions gradually and gives each group a stable address.',
  analogy:'An air-traffic controller for containers. You file the flight plan; it picks the runway, and it reroutes when one closes.',
  use:['Dozens of services that need scheduling, discovery and rolling deploys','Self-healing: failed containers come back without a human','One consistent platform across clouds or on-prem'],
  avoid:['One or two services: a managed container runner like Cloud Run or Fargate is far less to operate','Teams without time to learn, upgrade and secure the cluster itself'],
  example:'An API runs as a Kubernetes Deployment with 3 replicas. At 2 a.m. a node fails. The scheduler sees only 2 pods running, starts a replacement on a healthy node, and nobody gets paged.',
  providers:{aws:'EKS, ECS', gcp:'GKE', azure:'AKS', oss:'Kubernetes, Nomad, k3s'},
  lang:'yaml', code:String.raw`apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: 3                     # desired state
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: registry.example.com/api:1.4.2
          resources: { requests: { cpu: 250m, memory: 512Mi } }`,
  related:['containers','lb','workflow','autoscaling'],
  caption:'The Service spreads requests across three pods. When node-2 disappears, traffic skips it and the control plane starts a replacement, because the desired count is still 3.' },

{ id:'serverless', cat:'compute', name:'Serverless functions',
  short:'Upload a function; the cloud runs it only when something happens.',
  what:'You write a handler and choose what triggers it: an HTTP request, a new file, a queue message, a schedule. The platform starts instances on demand, runs as many in parallel as traffic needs, and shuts them down when idle. You pay per invocation and per millisecond of runtime, and there are no servers for you to patch.',
  analogy:'A taxi instead of a car you own. It shows up when you call, you pay for the ride, and insurance and parking are someone else’s problem.',
  use:['Event-driven glue: resize an image on upload, react to a queue message','Spiky or low traffic, where idle servers would waste money','Scheduled jobs and small APIs'],
  avoid:['Work that runs longer than the limit (15 minutes on AWS Lambda)','Latency-critical paths that can’t absorb an occasional cold start','Steady high throughput, where an always-on container is usually cheaper'],
  example:'Every time a sensor gateway uploads a compressed batch, a function unpacks it and writes the readings to the database. At night there are no uploads, so nothing runs and nothing is billed.',
  providers:{aws:'Lambda', gcp:'Cloud Run functions', azure:'Azure Functions', oss:'OpenFaaS, Knative, Cloudflare Workers'},
  lang:'python', code:String.raw`# handler.py: runs once per event
import json

def handler(event, context):
    order = json.loads(event["body"])
    total = sum(i["price"] * i["qty"] for i in order["items"])
    return {"statusCode": 200, "body": json.dumps({"total": total})}`,
  related:['containers','autoscaling','queue','apigw'],
  caption:'Bursts of requests spin up new instances; amber marks a cold start. When traffic stops, idle instances time out one by one until none are left.' },

{ id:'autoscaling', cat:'compute', name:'Autoscaling',
  short:'Add machines when load rises, remove them when it falls.',
  what:'An autoscaler watches a metric such as CPU, requests per instance or queue depth, and changes how many copies of a service run to keep that metric near a target. You set a minimum for availability, a maximum as a cost ceiling, and how fast it may react. New capacity takes time to boot, so scaling out always lags a sudden spike a little.',
  analogy:'A supermarket opening more checkout lanes when the lines get long, and closing them after the rush.',
  use:['Traffic with a daily or weekly shape','Batch backlogs that should drain faster when they’re deep','Keeping cost proportional to real usage'],
  avoid:['Stateful servers that can’t be added or removed without moving data','Spikes shorter than your boot time; pre-scale or put a queue in front'],
  example:'A dashboard API runs 2 instances overnight and 8 at 9 a.m., when every field office logs in. The only rule is “keep average CPU at 60%”.',
  providers:{aws:'EC2 Auto Scaling, Application Auto Scaling', gcp:'Managed instance groups', azure:'Virtual Machine Scale Sets', oss:'Kubernetes HPA, KEDA, Karpenter'},
  lang:'yaml', code:String.raw`apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }`,
  related:['serverless','lb','orchestration','vm'],
  caption:'As traffic ramps up, the group adds instances, each taking a moment to boot. Once the peak passes it scales back down to its minimum of 2.' },

/* ---------------- MESSAGING ---------------- */
{ id:'queue', cat:'messaging', name:'Message queues',
  short:'A to-do list between services: each job is done once, by one worker.',
  what:'Producers drop messages into the queue and move on. Workers pull a message, process it and delete it when done. If a worker crashes mid-job, the message reappears after a visibility timeout and another worker retries it. The queue absorbs bursts so a slow system downstream isn’t overwhelmed, and you go faster by adding workers.',
  analogy:'The ticket rail in a restaurant kitchen. Waiters clip orders up, cooks take the next one, and each order is cooked exactly once.',
  use:['Background jobs: emails, reports, image processing','Smoothing bursts so a database or API sees a steady rate','Retrying flaky work, with a dead-letter queue for messages that keep failing'],
  avoid:['Several systems each need every message; use pub/sub or a stream','You may want to replay old messages; once deleted they’re gone'],
  example:'A checkout service enqueues “send receipt” jobs. During a flash sale 5,000 arrive in one minute. Two workers drain them over the next few minutes, and the email provider never sees more than its rate limit.',
  providers:{aws:'SQS', gcp:'Cloud Tasks, Pub/Sub pull subscriptions', azure:'Service Bus queues, Storage queues', oss:'RabbitMQ, Redis + BullMQ, Celery'},
  lang:'python', code:String.raw`import boto3
sqs = boto3.client("sqs")
URL = "https://sqs.us-east-1.amazonaws.com/123456789012/receipts"

sqs.send_message(QueueUrl=URL, MessageBody='{"order_id": 4812}')

# worker loop: receive, process, then delete
resp = sqs.receive_message(QueueUrl=URL, WaitTimeSeconds=20)
for msg in resp.get("Messages", []):
    send_receipt(msg["Body"])
    sqs.delete_message(QueueUrl=URL, ReceiptHandle=msg["ReceiptHandle"])`,
  related:['stream','pubsub','serverless','workflow'],
  caption:'Checkout bursts faster than two workers can keep up, so jobs pile up in the queue. Each worker takes the next job only when it’s free, and every job is handled once.' },

{ id:'stream', cat:'messaging', name:'Event streams',
  short:'An append-only log of events that many readers replay at their own pace.',
  what:'Producers append records to the end of a log that’s kept for a retention period: hours, days or forever. Reading removes nothing. Each consumer group tracks its own position, called an offset, so a real-time alerting job, a dashboard and a nightly batch can all read the same data independently. Logs are split into partitions for scale, and order is guaranteed within a partition.',
  analogy:'A DVR recording of live TV. You can watch live, pause, or rewind to this morning, and your roommate can be at a different point in the same recording.',
  use:['High-volume telemetry, clickstreams and IoT readings','Several independent consumers of the same events','Reprocessing history after a bug fix or to build a new view'],
  avoid:['Simple job distribution where each task runs once; a queue is simpler','Low volume, where running a stream platform is more work than it saves'],
  example:'Thousands of well sensors publish pressure readings to a `readings` topic. Alerting reads each one within a second, the dashboard updates every few seconds, and the ML team replays the whole week on Sunday to retrain a model.',
  providers:{aws:'Kinesis Data Streams, MSK (Kafka)', gcp:'Managed Service for Apache Kafka, Pub/Sub', azure:'Event Hubs', oss:'Apache Kafka, Redpanda, Apache Pulsar'},
  lang:'python', code:String.raw`from kafka import KafkaProducer, KafkaConsumer

producer = KafkaProducer(bootstrap_servers="broker:9092")
producer.send("readings", key=b"well-42", value=b'{"psi": 812.4}')

# Each group_id keeps its own offset in the same log
consumer = KafkaConsumer("readings", group_id="alerts",
                         bootstrap_servers="broker:9092",
                         auto_offset_reset="earliest")
for record in consumer:
    check_thresholds(record.offset, record.value)`,
  related:['queue','pubsub','tsdb','eventbus'],
  caption:'Records stay in the log after they’re read. Three consumer groups move through the same records at different speeds; the ML job falls behind, then catches up in batches.' },

{ id:'pubsub', cat:'messaging', name:'Pub/sub',
  short:'Publish one message; every subscriber gets its own copy.',
  what:'A publisher sends a message to a topic without knowing who’s listening. The broker delivers a copy to every current subscriber. Adding a consumer means adding a subscription, with no change to the publisher. Plain pub/sub keeps no history, so an offline subscriber misses messages unless its subscription is backed by a durable queue.',
  analogy:'A group chat. You post once and everyone in the group sees it, but people who join later don’t see what was said before.',
  use:['Fan-out: one event triggers several independent reactions','Decoupling teams, since publishers don’t need to know about consumers','Device messaging over MQTT, where each device subscribes to its own topics'],
  avoid:['Work that one worker must do exactly once; that’s a queue','Consumers that need to replay history; that’s a stream'],
  example:'When an order is placed, one `OrderPlaced` message fans out to email, analytics and inventory. A year later the fraud team subscribes too, and the order service doesn’t change at all.',
  providers:{aws:'SNS, IoT Core (MQTT)', gcp:'Pub/Sub', azure:'Service Bus topics, Web PubSub', oss:'MQTT (Mosquitto, EMQX), NATS, Redis Pub/Sub'},
  lang:'python', code:String.raw`import boto3, json
sns = boto3.client("sns")

sns.publish(
    TopicArn="arn:aws:sns:us-east-1:123456789012:orders",
    Message=json.dumps({"type": "OrderPlaced", "order_id": 4812}),
)
# Email, analytics and inventory each subscribe to the topic,
# usually through their own SQS queue so nothing is lost.`,
  related:['queue','stream','eventbus'],
  caption:'Each message is copied to all three subscribers. While inventory is offline its copies are lost, which is why durable designs put a queue behind each subscriber.' },

{ id:'eventbus', cat:'messaging', name:'Event buses',
  short:'A router that sends each event to whoever has a rule for it.',
  what:'Services and SaaS apps emit events to one central bus. Rules match events on their fields (source, type, even values inside the payload) and deliver them to targets such as functions, queues, workflows or other accounts. It’s pub/sub with content-based routing and filtering built in, so each consumer receives only the events it asked for.',
  analogy:'A mailroom that reads each envelope and drops it in the right pigeonholes, following rules each department filed.',
  use:['Many event types from many sources, with routing that changes often','Reacting to cloud and SaaS events: a file landed, a payment settled','Cross-team or cross-account integration without point-to-point wiring'],
  avoid:['Very high-throughput telemetry; per-event pricing and latency favor a stream','Strict ordering requirements'],
  example:'Payments, orders and field alarms all publish to one bus. A rule sends `alarm` events with `severity=critical` to the on-call pager and to email, while `order` events start the fulfilment workflow.',
  providers:{aws:'EventBridge', gcp:'Eventarc', azure:'Event Grid', oss:'Knative Eventing, Argo Events'},
  lang:'json', code:String.raw`// EventBridge rule: match critical alarms from field devices
{
  "source": ["field.devices"],
  "detail-type": ["alarm"],
  "detail": { "severity": ["critical"] }
}
// Targets: the pager function and the email topic`,
  related:['pubsub','workflow','serverless'],
  caption:'Events from three sources arrive at one bus. Rules read each event’s type and send it only to matching targets: an alarm goes to two places, a payment to one.' },

{ id:'workflow', cat:'messaging', name:'Workflow orchestration',
  short:'A durable state machine that drives multi-step processes to completion.',
  what:'You define the steps of a process, their order, and what happens on failure: retries with backoff, timeouts, branches, parallel steps and compensating actions. The engine records every transition, so a process can wait days for a person or an outside system and resume exactly where it left off, even after a crash.',
  analogy:'A project manager with a checklist who never forgets where each project stands, chases late steps, and follows the backup plan when something fails.',
  use:['Processes that span services: order fulfilment, onboarding, data pipelines','Long waits on people, approvals or callbacks','Replacing tangled chains of queues and cron jobs that nobody can debug'],
  avoid:['One quick step; a function or queue is enough','Very high-rate, low-latency event processing'],
  example:'An order workflow validates the cart, charges the card with up to 3 retries, then ships. If the charge is declined, it runs a compensation step that releases the reserved stock and tells the customer.',
  providers:{aws:'Step Functions', gcp:'Workflows', azure:'Durable Functions, Logic Apps', oss:'Temporal, Apache Airflow, Argo Workflows'},
  lang:'python', code:String.raw`# Temporal workflow: each step is retried and its result recorded
@workflow.defn
class OrderWorkflow:
    @workflow.run
    async def run(self, order: Order) -> str:
        await workflow.execute_activity(validate, order, start_to_close_timeout=T(seconds=30))
        try:
            await workflow.execute_activity(charge_card, order,
                retry_policy=RetryPolicy(maximum_attempts=3),
                start_to_close_timeout=T(minutes=2))
        except ActivityError:
            await workflow.execute_activity(release_stock, order, start_to_close_timeout=T(seconds=30))
            return "cancelled"
        await workflow.execute_activity(ship, order, start_to_close_timeout=T(days=3))
        return "shipped"`,
  related:['orchestration','queue','eventbus'],
  caption:'Each order moves through the steps. About one card charge in four is declined, and those orders take the compensation branch instead of shipping.' },

/* ---------------- STORAGE ---------------- */
{ id:'object', cat:'storage', name:'Object storage',
  short:'Practically unlimited storage for files of any size, addressed by key.',
  what:'Object storage keeps blobs (files) in buckets, each under a key like `photos/2026/09/a.jpg`, with metadata attached. You read and write whole objects through an HTTP API instead of mounting a disk. It scales without capacity planning, replicates across facilities for extreme durability, and offers cheaper tiers for data you rarely touch. It’s the default home for backups, media, logs and data lakes.',
  analogy:'A coat check. Hand over your coat, get a ticket, and use the ticket to get that exact coat back. You can’t alter a sleeve while it’s hanging there.',
  use:['Images, video, backups, exports and logs','Data lakes: Parquet or Iceberg files queried by warehouse engines','Static website assets served through a CDN'],
  avoid:['Databases, or anything that rewrites small parts of a file in place','Low-latency random reads and writes; that’s block storage'],
  example:'A mobile app uploads profile photos straight to a bucket with pre-signed URLs. A lifecycle rule moves photos older than 90 days to an archive tier that costs a fraction as much.',
  providers:{aws:'S3', gcp:'Cloud Storage', azure:'Blob Storage', oss:'MinIO, Ceph (RGW), Cloudflare R2'},
  lang:'python', code:String.raw`import boto3
s3 = boto3.client("s3")

s3.upload_file("a.jpg", "media", "photos/2026/09/a.jpg")

url = s3.generate_presigned_url(          # temporary download link
    "get_object",
    Params={"Bucket": "media", "Key": "photos/2026/09/a.jpg"},
    ExpiresIn=3600,
)`,
  related:['block','file','cdn','warehouse'],
  caption:'Uploads are written as whole objects and viewers read them back by key. Every so often a lifecycle rule moves old objects to the cheap archive tier.' },

{ id:'block', cat:'storage', name:'Block storage',
  short:'A virtual hard drive you attach to one machine.',
  what:'Block storage gives a server a raw disk, which it formats with a filesystem like ext4 or NTFS. It handles fast, small, random reads and writes, which is what databases and operating systems need. A volume lives in one availability zone, is usually attached to one VM at a time, and is backed up with point-in-time snapshots.',
  analogy:'An external SSD plugged into one laptop. Quick and flexible, but only that laptop can use it at any moment.',
  use:['Boot disks for VMs','Self-managed databases that need low-latency random I/O','Any app that expects an ordinary local filesystem'],
  avoid:['Sharing files between many servers; use file storage','Storing lots of media or backups cheaply; use object storage'],
  example:'A PostgreSQL server on a VM keeps its data on a 500 GB volume provisioned for 3,000 IOPS. A nightly snapshot is copied to another region for disaster recovery.',
  providers:{aws:'EBS', gcp:'Persistent Disk, Hyperdisk', azure:'Managed Disks', oss:'Ceph RBD, Longhorn, LVM'},
  lang:'bash', code:String.raw`aws ec2 create-volume --availability-zone us-east-1a \
  --size 500 --volume-type gp3 --iops 3000
aws ec2 attach-volume --volume-id vol-0a1b2c3d \
  --instance-id i-0123456789abcdef0 --device /dev/sdf

# then, on the VM
sudo mkfs -t ext4 /dev/nvme1n1 && sudo mount /dev/nvme1n1 /data`,
  related:['object','file','vm','relational'],
  caption:'The VM makes many small, fast reads and writes to its attached volume. Periodic snapshots copy the volume’s state to durable storage.' },

{ id:'file', cat:'storage', name:'File storage',
  short:'A shared network drive that many servers mount at once.',
  what:'Managed file storage exposes an ordinary folder hierarchy over NFS or SMB. Many machines can mount the same share and read and write the same files at the same time, with normal permissions and locking. Capacity grows as you add data. It’s slower than a local disk, and far easier than syncing files between servers.',
  analogy:'The shared drive at the office. Everyone sees the same folders and can open the same spreadsheet.',
  use:['Legacy apps that expect a shared directory','Content management systems, home directories, shared ML datasets','Several containers that need the same files'],
  avoid:['Databases, which want block storage','Huge archives or public downloads; object storage is cheaper and scales further'],
  example:'A render farm of 40 servers mounts `/mnt/shared`. Every node reads the same scene files and writes its finished frames back into one folder.',
  providers:{aws:'EFS, FSx', gcp:'Filestore', azure:'Azure Files, NetApp Files', oss:'NFS, CephFS, GlusterFS'},
  lang:'bash', code:String.raw`# Every server runs the same mount
sudo mount -t nfs4 -o nfsvers=4.1 \
  fs-0a1b2c3d.efs.us-east-1.amazonaws.com:/ /mnt/shared

ls /mnt/shared/scenes`,
  related:['block','object'],
  caption:'Three render nodes read from and write to one shared filesystem at the same time, and all of them see the same files.' },

/* ---------------- DATABASES ---------------- */
{ id:'relational', cat:'data', name:'Relational databases',
  short:'Tables, SQL and transactions: the dependable default.',
  what:'A relational database stores data in tables with a defined schema and relationships between them. You query it with SQL, join across tables, and group changes into ACID transactions so they all happen or none do. Managed services handle backups, failover, patching and read replicas that take read-heavy queries off the primary.',
  analogy:'A meticulous accountant’s ledger. Every entry follows the rules, the books always balance, and you can ask it almost any question.',
  use:['Most business data: users, orders, inventory, billing','Data with relationships you want to query flexibly','Anything where correctness matters more than raw write speed'],
  avoid:['Billions of tiny writes a day with simple access patterns; consider key-value or time-series','Scanning petabytes for analytics, which belongs in a warehouse'],
  example:'An online store keeps customers, orders and order lines in PostgreSQL. Placing an order inserts the order and decrements stock in one transaction. Finance reports run on a read replica so they don’t slow checkout.',
  providers:{aws:'RDS, Aurora', gcp:'Cloud SQL, AlloyDB, Spanner', azure:'Azure SQL Database, Azure Database for PostgreSQL', oss:'PostgreSQL, MySQL, MariaDB'},
  lang:'sql', code:String.raw`BEGIN;
INSERT INTO orders (customer_id, total) VALUES (42, 129.00);
UPDATE inventory SET on_hand = on_hand - 1 WHERE sku = 'PUMP-ROD-7';
COMMIT;   -- both changes happen, or neither does

SELECT c.name, count(o.id) AS orders
FROM customers c JOIN orders o ON o.customer_id = c.id
GROUP BY c.name ORDER BY orders DESC LIMIT 10;`,
  related:['nosql','cache','warehouse','tsdb'],
  caption:'The app reads and writes the primary. The primary streams its changes to a read replica, and reporting queries go to the replica instead.' },

{ id:'nosql', cat:'data', name:'Key-value & document stores',
  short:'Fast lookups by key at almost any scale, with a flexible schema.',
  what:'Key-value and document databases store items addressed by a key, often as JSON. The key is hashed to pick a partition, so a table spreads across many servers and scales almost linearly. Reads and writes by key take single-digit milliseconds at any size. In exchange, you design around your access patterns up front, because joins and ad-hoc queries are limited.',
  analogy:'A giant wall of numbered lockers. If you know the number you’re there instantly; searching every locker for a red scarf takes all day.',
  use:['Sessions, shopping carts, user profiles, device state','Massive scale with predictable access by key','Documents whose shape keeps evolving'],
  avoid:['Ad-hoc reporting and complex joins','Early products that don’t yet know their access patterns'],
  example:'A game stores each player’s inventory in DynamoDB keyed by `player_id`. Ten million players spread across partitions, and every lookup takes about 5 ms.',
  providers:{aws:'DynamoDB, DocumentDB', gcp:'Firestore, Bigtable', azure:'Cosmos DB', oss:'MongoDB, Cassandra, ScyllaDB'},
  lang:'python', code:String.raw`import boto3
table = boto3.resource("dynamodb").Table("players")

table.put_item(Item={"player_id": "p#8812", "level": 31, "gold": 1200})
item = table.get_item(Key={"player_id": "p#8812"})["Item"]`,
  related:['relational','cache'],
  caption:'Each request’s key is hashed to one partition, so the same key (same color) always lands on the same partition, and load spreads across all three.' },

{ id:'cache', cat:'data', name:'Caches',
  short:'Keep hot data in memory so you don’t ask the slow system twice.',
  what:'A cache is an in-memory key-value store in front of something slower, such as a database or an API. On a hit the answer comes back in under a millisecond. On a miss the app fetches from the source and stores the result with a time-to-live. The hard parts are deciding how stale data may get and clearing entries when the source changes.',
  analogy:'Keeping the reference book you use every day on your desk instead of walking to the library each time.',
  use:['Read-heavy data that changes slowly: product pages, config, computed summaries','Shielding a database from the same query repeated thousands of times','Sessions, rate-limit counters, leaderboards'],
  avoid:['Data that must always be exactly current','Being the only copy of anything important; caches get evicted and restarted'],
  example:'A well-status endpoint takes 180 ms to compute from the database. Caching the result for 60 seconds answers 70% of requests in under a millisecond and cuts database load by the same share.',
  providers:{aws:'ElastiCache, MemoryDB', gcp:'Memorystore', azure:'Azure Managed Redis', oss:'Redis, Valkey, Memcached'},
  lang:'python', code:String.raw`import json, redis
r = redis.Redis(host="cache", port=6379)

def well_status(well_id: int) -> dict:
    key = f"well-status:{well_id}"
    if (hit := r.get(key)) is not None:
        return json.loads(hit)                 # fast path
    status = compute_from_database(well_id)    # slow path
    r.set(key, json.dumps(status), ex=60)      # keep for 60 s
    return status`,
  related:['nosql','cdn','relational'],
  caption:'Most requests are answered by the cache (HIT). Misses go through to the slow database, and the answer is stored for next time.' },

{ id:'tsdb', cat:'data', name:'Time-series databases',
  short:'A database shaped for measurements stamped with time.',
  what:'Time-series databases are built for data that arrives as timestamp, source and value, and is almost always appended rather than updated. They split data into time chunks, compress old chunks heavily, and keep pre-computed rollups so questions like “hourly average for the last 30 days” stay fast. Retention policies drop or downsample old data automatically.',
  analogy:'A ship’s logbook with a fresh page every day. Recent pages lie open on the desk; old volumes get summarized and shelved.',
  use:['IoT and sensor telemetry, infrastructure metrics, market ticks','Dashboards over recent windows plus long-term trends','High ingest rates where rows are rarely changed'],
  avoid:['Transactional business data with frequent updates','Data you don’t mainly query by time'],
  example:'Pressure readings from thousands of wells land every few seconds in a TimescaleDB hypertable. The live chart reads the last 15 minutes, and a continuous aggregate keeps hourly averages, so a one-year chart reads 8,760 rows instead of millions.',
  providers:{aws:'Timestream', gcp:'Bigtable, BigQuery', azure:'Azure Data Explorer', oss:'TimescaleDB, InfluxDB, Prometheus, QuestDB'},
  lang:'sql', code:String.raw`CREATE TABLE readings (time timestamptz NOT NULL, well_id int, psi double precision);
SELECT create_hypertable('readings', by_range('time', INTERVAL '1 day'));

-- hourly rollup, kept up to date automatically
CREATE MATERIALIZED VIEW readings_hourly WITH (timescaledb.continuous) AS
SELECT time_bucket('1 hour', time) AS hour, well_id, avg(psi) AS avg_psi
FROM readings GROUP BY hour, well_id;`,
  related:['stream','relational','warehouse'],
  caption:'Readings are appended in time order. The live chart reads each new row almost at once, while the rollup job wakes periodically and summarizes a batch.' },

{ id:'warehouse', cat:'data', name:'Data warehouses',
  short:'A columnar database for big analytical questions over all your data.',
  what:'A data warehouse gathers data from many systems and stores it column by column, so a query that averages one field over billions of rows reads only that column. Compute scales separately from storage, sometimes to hundreds of nodes for a single query. A lakehouse applies the same idea to open table formats such as Apache Iceberg sitting in object storage.',
  analogy:'A national library’s research archive. You go there to answer “how has this changed over ten years?”, and nobody expects the answer in a millisecond.',
  use:['BI dashboards and reporting across many sources','Ad-hoc analysis of years of history','Building ML training sets'],
  avoid:['Serving an app’s per-user reads and writes','Real-time lookups that need millisecond latency'],
  example:'Hourly jobs load orders, payment events and CSV exports into BigQuery. An analyst joins three years of data to see which regions churned after a price change; the query scans 2 TB in about 20 seconds.',
  providers:{aws:'Redshift, Athena + S3 Tables', gcp:'BigQuery', azure:'Microsoft Fabric, Synapse', oss:'Iceberg + Trino, ClickHouse, DuckDB; also Snowflake, Databricks'},
  lang:'sql', code:String.raw`SELECT region,
       date_trunc('month', churned_at) AS month,
       count(*) AS churned
FROM analytics.customers
WHERE churned_at >= '2023-01-01'
GROUP BY region, month
ORDER BY month, churned DESC;`,
  related:['object','relational','tsdb','stream'],
  caption:'Load jobs pull data from three sources into the warehouse. An analyst’s query takes longer than an app lookup, but it can cover everything at once.' },

/* ---------------- NETWORKING ---------------- */
{ id:'lb', cat:'network', name:'Load balancers',
  short:'Spreads incoming traffic across healthy servers.',
  what:'A load balancer gives a service one stable address and forwards each request or connection to one of several backends. It runs health checks and stops sending traffic to failed instances, terminates TLS, and lets you add or remove servers without clients noticing. Layer 4 balancers forward TCP and UDP connections; layer 7 balancers understand HTTP and can route by host name or path.',
  analogy:'The host at a busy restaurant, seating each new party with a waiter who’s free and skipping the section that’s closed.',
  use:['Running more than one copy of any service','Zero-downtime deploys: drain old instances, add new ones','Terminating TLS in one place'],
  avoid:['A single instance with no redundancy; it adds cost and little else','Cross-region failover on its own; that needs DNS or a global balancer'],
  example:'Three API servers sit behind an Application Load Balancer. When server 2 fails its `/health` check, the balancer stops routing to it within seconds, and users only ever see the other two answer.',
  providers:{aws:'Elastic Load Balancing (ALB, NLB)', gcp:'Cloud Load Balancing', azure:'Load Balancer, Application Gateway', oss:'NGINX, HAProxy, Envoy'},
  lang:'nginx', code:String.raw`upstream api {
    server 10.0.1.11:8080;
    server 10.0.1.12:8080;
    server 10.0.1.13:8080;
}
server {
    listen 443 ssl;
    location / { proxy_pass http://api; }   # round robin by default
}`,
  related:['apigw','cdn','autoscaling','dns'],
  caption:'Requests are handed out in turn across three servers. When server 2 fails its health check, it’s skipped until it recovers.' },

{ id:'cdn', cat:'network', name:'CDNs',
  short:'Copies of your content cached close to your users.',
  what:'A content delivery network runs hundreds of edge locations around the world. Users connect to the nearest one. If it has a cached copy of the file it answers immediately; if not, it fetches from your origin once and keeps the copy for everyone nearby. CDNs also absorb traffic spikes and attacks and terminate TLS at the edge.',
  analogy:'A bookstore chain stocking bestsellers in every local branch instead of shipping each copy from the central warehouse.',
  use:['Static assets: JavaScript, CSS, images, video','Global audiences far from your origin region','Shielding your origin from spikes and DDoS attacks'],
  avoid:['Highly personalized responses that can’t be cached, unless you add edge compute','Content that must change everywhere instantly, since invalidation takes time'],
  example:'A web app’s origin is in Virginia. A user in Tokyo loads the 2 MB JavaScript bundle from the Tokyo edge in 20 ms instead of 180 ms, and the origin serves one request instead of millions.',
  providers:{aws:'CloudFront', gcp:'Cloud CDN', azure:'Front Door', oss:'Varnish; also Cloudflare, Fastly, Akamai'},
  lang:'http', code:String.raw`# Headers from the origin tell every edge how long to cache
HTTP/1.1 200 OK
Content-Type: application/javascript
Cache-Control: public, max-age=31536000, immutable
ETag: "app.9f2c1e.js"`,
  related:['cache','lb','object','dns'],
  caption:'Viewers in Tokyo and London hit their nearest edge. Most requests are served from the edge cache; only misses make the long trip to the origin.' },

{ id:'apigw', cat:'network', name:'API gateways',
  short:'The front door for your APIs: auth, limits and routing in one place.',
  what:'An API gateway sits in front of backend services and handles what every API needs: authenticating callers with API keys, JWTs or OAuth, rate limits and quotas, request validation, routing paths to the right service, and usage metrics. The services behind it can focus on business logic.',
  analogy:'Building reception. They check your badge, sign you in, cap how many visitors each company gets, and tell you which floor to go to.',
  use:['Public or partner APIs that need keys, quotas and usage plans','One entry point in front of many microservices or functions','Consistent auth and throttling without rebuilding it in every service'],
  avoid:['High-volume internal service-to-service calls, where it adds latency and cost','Serving static files; that’s a CDN’s job'],
  example:'A partner integration gets an API key limited to 100 requests per second. The gateway rejects bad tokens with 401 and excess traffic with 429, and routes `/orders/*` and `/users/*` to separate services.',
  providers:{aws:'API Gateway', gcp:'Apigee, API Gateway', azure:'API Management', oss:'Kong, Tyk, Envoy Gateway'},
  lang:'yaml', code:String.raw`# Kong declarative config
services:
  - name: orders
    url: http://orders.internal:8080
    routes: [{ paths: ["/orders"] }]
    plugins:
      - name: key-auth
      - name: rate-limiting
        config: { second: 100 }`,
  related:['lb','serverless','iam'],
  caption:'Calls from three clients pass through the gateway. Some are rejected for bad credentials or rate limits; the rest are routed by path to the right service.' },

{ id:'dns', cat:'network', name:'DNS',
  short:'The internet’s phone book: turns names into addresses.',
  what:'DNS translates a name like `api.example.com` into an IP address. Your device asks a resolver, which answers from its cache or walks the hierarchy (the root, then `.com`, then your domain’s authoritative servers) and caches the answer for the record’s TTL. Cloud DNS services add health-checked failover and routing by latency or geography.',
  analogy:'Calling a contact from your phone instead of memorizing their number. If they get a new number, you update the contact and every call still goes through.',
  use:['Giving every service a stable name','Failing over between regions or providers','Moving infrastructure without changing client configuration'],
  avoid:['Instant cutovers: cached answers live until their TTL expires','Fine-grained load balancing, since clients cache and choose records unpredictably'],
  example:'`api.example.com` has a 60-second TTL and health-checked records in two regions. When us-east-1 fails its check, Route 53 starts answering with the us-west-2 address, and most clients follow within a minute or two.',
  providers:{aws:'Route 53', gcp:'Cloud DNS', azure:'Azure DNS', oss:'BIND, CoreDNS, PowerDNS; also Cloudflare DNS'},
  lang:'bash', code:String.raw`$ dig +noall +answer api.example.com
api.example.com.   60   IN   A   203.0.113.10
#                  ^^ TTL: resolvers may reuse this answer for 60 s`,
  related:['cdn','lb'],
  caption:'The browser asks a resolver. Cached answers return right away; on a miss the resolver asks the authoritative server (after walking the root and TLD servers, in reality) and caches the result.' },

{ id:'vpc', cat:'network', name:'Virtual private clouds',
  short:'Your own private, isolated network inside the cloud.',
  what:'A virtual private cloud is a software-defined network with an IP range you choose, like `10.0.0.0/16`, split into subnets. Public subnets route to the internet; private subnets have no inbound path from it. Route tables, security groups and network ACLs decide what may talk to what, and a NAT gateway lets private machines make outbound calls without being reachable.',
  analogy:'A gated campus. The lobby faces the street, the labs are deep inside behind badge-only doors, and deliveries leave through a one-way loading dock.',
  use:['Every production deployment: databases and internal services stay off the internet','Connecting the cloud to an office or data center over VPN','Separating environments or teams'],
  avoid:['Treating it as your whole security story; you still need IAM, patching and encryption','Overlapping IP ranges between networks you may later want to connect'],
  example:'Only the load balancer sits in a public subnet. The app servers and database live in private subnets, and the database accepts port 5432 only from the app servers’ security group. Apps download packages through a NAT gateway.',
  providers:{aws:'VPC', gcp:'VPC network', azure:'Virtual Network (VNet)', oss:'WireGuard, Tailscale, Calico'},
  lang:'ts', code:String.raw`// AWS CDK: one VPC, three tiers of subnets
const vpc = new ec2.Vpc(this, "Main", {
  ipAddresses: ec2.IpAddresses.cidr("10.0.0.0/16"),
  maxAzs: 2,
  subnetConfiguration: [
    { name: "public", subnetType: ec2.SubnetType.PUBLIC },
    { name: "app",    subnetType: ec2.SubnetType.PRIVATE_WITH_EGRESS },
    { name: "db",     subnetType: ec2.SubnetType.PRIVATE_ISOLATED },
  ],
});`,
  related:['lb','iam','secrets'],
  caption:'Internet traffic can only enter through the load balancer in the public subnet. The app servers and database have no public address, and the app servers reach the internet outbound through the NAT gateway.' },

/* ---------------- OPERATIONS ---------------- */
{ id:'iac', cat:'ops', name:'Infrastructure as code',
  short:'Describe your infrastructure in files and let a tool build it.',
  what:'Instead of clicking through a console, you declare resources (networks, databases, queues, permissions) in files kept in git. The tool compares that desired state with what exists, shows a plan of what it will create, change or destroy, and then calls the cloud APIs to apply it. Environments become reproducible, changes get code review, and the history lives in version control.',
  analogy:'An architect’s blueprint. Hand the same drawings to any builder and you get the same house, and every change starts as a revision on paper.',
  use:['Anything beyond a quick experiment','Keeping dev, staging and production identical','Reviewing infrastructure changes like code, with a plan preview'],
  avoid:['Editing tool-managed resources by hand in the console; that creates drift','Treating the state file casually; store it safely and lock it'],
  example:'A pull request adds a queue and lets a function read from it. CI runs `terraform plan`, the reviewer sees “2 to add, 1 to change”, and merging applies it to staging and then production.',
  providers:{aws:'CloudFormation, CDK', gcp:'Infrastructure Manager', azure:'Bicep, ARM templates', oss:'Terraform, OpenTofu, Pulumi'},
  lang:'hcl', code:String.raw`resource "aws_sqs_queue" "receipts" {
  name                       = "receipts"
  visibility_timeout_seconds = 60
}

resource "aws_s3_bucket" "media" {
  bucket = "example-media-prod"
}
# $ terraform plan  ->  Plan: 2 to add, 0 to change, 0 to destroy.`,
  related:['cicd','vpc','iam'],
  caption:'Each change to the code produces a plan, and the cloud API creates or updates exactly the resources that plan lists.' },

{ id:'observability', cat:'ops', name:'Observability',
  short:'Logs, metrics and traces that tell you what your system is doing.',
  what:'Observability means emitting enough telemetry to answer questions about production you didn’t think to ask in advance. Logs are timestamped records of events. Metrics are numbers aggregated over time, like requests per second or p95 latency. Traces follow one request across every service it touches. A collector such as OpenTelemetry gathers all three and ships them to storage, dashboards and alerting.',
  analogy:'A car’s gauges, trip log and dashcam. The gauges show how it’s doing now, the log shows what happened, and the dashcam shows one whole journey.',
  use:['Every production system, from the first day','Alerting on symptoms users feel: errors, latency, saturation','Finding the slow step in a request that crosses many services'],
  avoid:['Debug-level logging of everything in production; the bill grows fast','Alerting on every metric; page people only for what needs a human'],
  example:'A jump in p95 latency fires an alert. The trace of one slow request shows 1.8 s inside a single database query, and that service’s logs show the slowdown began right after a deploy.',
  providers:{aws:'CloudWatch, X-Ray', gcp:'Cloud Logging, Monitoring, Trace', azure:'Azure Monitor, Application Insights', oss:'OpenTelemetry, Prometheus, Grafana, Jaeger; also Datadog, Better Stack'},
  lang:'python', code:String.raw`from opentelemetry import trace, metrics
tracer = trace.get_tracer("api")
latency = metrics.get_meter("api").create_histogram("http.server.duration", unit="ms")

with tracer.start_as_current_span("GET /wells/{id}") as span:   # trace
    span.set_attribute("well.id", 42)
    log.info("fetching well status", extra={"well_id": 42})    # log
    latency.record(38.5, {"route": "/wells/{id}"})             # metric`,
  related:['tsdb','cicd'],
  caption:'Two services emit logs, metrics and traces. The collector routes each kind to its own store, and now and then a metric crosses its threshold and fires an alert.' },

{ id:'cicd', cat:'ops', name:'CI/CD pipelines',
  short:'An automated path from a commit to production.',
  what:'Continuous integration builds and tests every change as soon as it’s pushed, so problems show up within minutes. Continuous delivery then packages the tested build and promotes it through environments, usually automatically to staging and with checks or an approval before production. The pipeline itself is defined in code next to the application.',
  analogy:'An assembly line with inspection stations. Every part is checked at each station, and faulty ones come off the line before they reach a customer.',
  use:['Any codebase with more than one contributor','Frequent, small, low-risk releases','Enforcing tests, linting and security scans before merge'],
  avoid:['Pipelines so slow that people route around them; keep feedback fast','Skipping tests to ship sooner; a pipeline is only as good as its checks'],
  example:'A push triggers a build and 900 tests that finish in 6 minutes. When a test fails, the author is notified and the change stops there. Green builds deploy to staging, then to production.',
  providers:{aws:'CodePipeline, CodeBuild', gcp:'Cloud Build, Cloud Deploy', azure:'Azure Pipelines', oss:'GitHub Actions, GitLab CI, Jenkins, Argo CD'},
  lang:'yaml', code:String.raw`# .github/workflows/ci.yml
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: pytest
  deploy:
    needs: test                     # only runs if tests pass
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: ./deploy.sh production`,
  related:['iac','containers','observability'],
  caption:'Each push is built and tested. About one in five fails its tests and goes back to the author; the rest move on through staging to production.' },

{ id:'secrets', cat:'ops', name:'Secrets management',
  short:'A locked vault for passwords, keys and tokens, handed out at runtime.',
  what:'A secrets manager stores credentials encrypted and hands them only to callers whose identity is allowed to read them. Apps fetch secrets at startup or on demand instead of keeping them in code or config files. Every read is audited, and many managers rotate credentials automatically, changing the database password and the stored value together.',
  analogy:'A hotel safe with an access log. Only the right keycard opens it, every opening is recorded, and the combination changes on a schedule.',
  use:['Database passwords, API keys, signing keys, certificates','Automatic credential rotation','Auditing who read which secret, and when'],
  avoid:['Committing secrets to git, even in a private repository','Baking secrets into images or printing them in CI logs'],
  example:'The API’s role is allowed to read `db/password`, so it fetches the current value on boot. Every 30 days the manager rotates the database password. A script on someone’s laptop with no role is refused.',
  providers:{aws:'Secrets Manager, SSM Parameter Store', gcp:'Secret Manager', azure:'Key Vault', oss:'HashiCorp Vault, OpenBao, SOPS'},
  lang:'python', code:String.raw`import boto3, json, psycopg

                       password=secret["password"], dbname="app")`,
  related:['iam','vpc','iac'],
  caption:'The app, running with an allowed role, gets the secret. The laptop script has no permission and is refused. Periodically the manager rotates the database password.' },

{ id:'iam', cat:'ops', name:'Identity & access (IAM)',
  short:'Who can do what, to which resource.',
  what:'Identity and access management authenticates every caller (people, services, machines) and checks each API call against policies. Cloud IAM denies by default: a request succeeds only if some policy explicitly allows that action on that resource and no policy explicitly denies it. The goal is least privilege, where each identity has exactly the permissions its job needs.',
  analogy:'Keycards in an office building. Your card opens the doors your job needs, and every swipe is logged.',
  use:['Every cloud account, from day one','Giving services short-lived role credentials instead of long-lived keys','Separating what developers, CI and production workloads can touch'],
  avoid:['`*` actions on `*` resources, even “temporarily”','One shared admin login for several people or services'],
  example:'A report function’s role allows `s3:GetObject` on `reports/*` and nothing more. When an intern’s account tries to delete objects in that bucket, the call fails with AccessDenied.',
  providers:{aws:'IAM, IAM Identity Center', gcp:'Cloud IAM', azure:'Microsoft Entra ID, Azure RBAC', oss:'Keycloak, Open Policy Agent'},
  lang:'json', code:String.raw`{
  "Version": "2012-10-17",
  "Statement": [{
    "Effect": "Allow",

    "Resource": "arn:aws:s3:::acme-reports/reports/*"
  }]
}`,
  related:['secrets','apigw','vpc'],
  caption:'Three identities call the same bucket. Policy evaluation allows the function role and the CI pipeline their specific actions, and denies the intern’s delete by default.' },
];

const NS = 'http://www.w3.org/2000/svg';
const COL = ['var(--p1)','var(--p2)','var(--p3)','var(--p4)'];
const SPEED = 0.2;              // px per ms at 1x
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let uid = 0;

function sv(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const tw = (s, px, mono) => (s ? s.length * px * (mono ? 0.6 : 0.57) : 0);
const rnd = n => Math.floor(Math.random() * n);

class Sim {
  constructor(host, spec, opts){
    this.spec = spec; this.t = 0; this.speed = 1; this.running = !REDUCED; this.visible = true; this.dead = false;
    this.onNav = opts.onNav; this.current = opts.current;
    this.W = spec.w || 760; this.H = spec.h || 260;
    this.packets = []; this.timers = []; this.dies = [];
    this.N = {};
    spec.nodes.forEach(n => { this.N[n.id] = this.initNode(JSON.parse(JSON.stringify(n))); });
    this.events = (spec.events || []).map(e => ({...e, next:e.at}));
    this.build(host);
    this.io = new IntersectionObserver(es => { this.visible = es[0].isIntersecting; }, {rootMargin:'80px'});
    this.io.observe(this.svg);
  }

  initNode(n){

    if (n.kind === 'svc'){

    } else if (n.kind === 'pool'){

      n.h = 64;
